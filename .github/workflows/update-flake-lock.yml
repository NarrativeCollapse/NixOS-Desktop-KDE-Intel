name: Update flake.lock

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Update inputs
        run: nix flake update 2>&1 | tee update.log

      # Pull requests opened with the default token don't trigger other
      # workflows, so the update is checked and built here instead.
      - name: Check and build the updated system
        run: |
          nix flake check --print-build-logs
          nix build --print-build-logs --no-link .#nixosConfigurations.shitbox.config.system.build.toplevel

      - name: Summarize changes
        id: summary
        run: |
          {
            echo 'body<<EOF'
            echo 'Weekly `nix flake update`. `nix flake check` and a full system build passed on the updated lock.'
            echo
            echo '```'
            grep -E "Updated input|→|'github:" update.log || echo "(no input changes)"
            echo '```'
            echo
            echo 'Before merging: bump `version` in flake.nix and the README (see Versions in README.md).'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          rm update.log

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-flake-lock
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
          body: ${{ steps.summary.outputs.body }}
          delete-branch: true
