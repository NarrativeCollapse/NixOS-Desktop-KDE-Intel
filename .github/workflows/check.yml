name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow only checks and builds.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The full system closure (Plasma, Steam, fonts) needs more disk than a
      # stock runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # Format, statix, deadnix, README version, and evaluation of the system.
      - name: nix flake check
        run: nix flake check --print-build-logs

      # Evaluating isn't building: this catches packages that fail to build.
      - name: Build the system
        run: nix build --print-build-logs --no-link .#nixosConfigurations.shitbox.config.system.build.toplevel
