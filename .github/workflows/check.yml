name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow only checks and builds.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Frees disk space and installs Nix.
      - uses: ./.github/actions/setup-nix

      # Format, statix, deadnix, README version, evaluation of the system, and
      # the VM boot test (tests/boot.nix; install-nix-action enables KVM).
      - name: nix flake check
        run: nix flake check --print-build-logs

      # NixOS warns about a renamed or deprecated option for a release or so
      # before it becomes an error, so a warning now is a failed build at a
      # later upgrade. Fail now, while the fix is easy.
      - name: No evaluation warnings
        run: scripts/check-eval-warnings.sh

      # Evaluating isn't building: this catches packages that fail to build.
      - name: Build the system
        run: nix build --print-build-logs --no-link .#nixosConfigurations.shitbox.config.system.build.toplevel
