name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow only checks and builds.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Disk space, Nix, and the cache of packages CI builds itself.
      - uses: ./.github/actions/setup-nix

      # Format, statix, deadnix, README version, and evaluation of the system.
      - name: nix flake check
        run: nix flake check --print-build-logs

      # Evaluating isn't building: this catches packages that fail to build.
      - name: Build the system
        run: nix build --print-build-logs --no-link .#nixosConfigurations.shitbox.config.system.build.toplevel

      # Keep this run's newly built packages for the next run (see
      # .github/actions/setup-nix). Saved even after a failure, so work done
      # before it isn't repeated.
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ runner.temp }}/nix-cache
          key: nix-build-cache-${{ github.run_id }}
