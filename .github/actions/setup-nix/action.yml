name: Set up Nix with the build cache
description: >
  Frees disk space, installs Nix, and restores a small binary cache of the
  packages CI had to build itself. Pair it with save-nix-cache at the end of
  the job.

runs:
  using: composite
  steps:
    # The full system closure (Plasma, Steam, fonts) needs more disk than a
    # stock runner leaves free.
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /

    # Almost everything comes prebuilt from cache.nixos.org. The exceptions
    # are packages this config changes: mainly Xwayland, which NixOS
    # rebuilds with the system's X11 font path (over 2 minutes per run).
    # The post-build hook copies each package built here, and only that
    # package (not its dependencies), into a local binary cache that
    # actions/cache carries between runs; the next run takes it from there.
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          extra-substituters = file://${{ runner.temp }}/nix-cache?trusted=true&priority=30
          post-build-hook = ${{ runner.temp }}/nix-post-build-hook.sh

    - uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/nix-cache
        key: nix-build-cache-${{ github.run_id }}
        restore-keys: nix-build-cache-

    - name: Prepare the build cache
      shell: bash
      env:
        CACHE: ${{ runner.temp }}/nix-cache
        HOOK: ${{ runner.temp }}/nix-post-build-hook.sh
      run: |
        # Old packages pile up as nixpkgs moves on; start over past 2 GB.
        if [ -d "$CACHE" ] && [ "$(du -sm "$CACHE" | cut -f1)" -gt 2048 ]; then
          echo "Build cache is over 2 GB; starting a fresh one."
          rm -rf "$CACHE"
        fi
        mkdir -p "$CACHE"
        du -sh "$CACHE"
        # Runs as root in the Nix daemon after every local build. A failed
        # upload only means a slower next run, so it never fails the build.
        cat > "$HOOK" <<HOOK
        #!/bin/sh
        set -f
        /nix/var/nix/profiles/default/bin/nix copy --no-recursive \\
          --to 'file://$CACHE?compression=zstd' \$OUT_PATHS \\
          || echo "post-build-hook: caching \$OUT_PATHS failed (ignored)"
        HOOK
        chmod +x "$HOOK"
